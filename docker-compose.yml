services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports:
      - "5332:5432"   # 左邊是本機門牌 5332，右邊是容器裡的 5432
    healthcheck:   # healthcheck（健康檢查）：定期問資料庫準備好了沒
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]   # pg_isready = 問「可以接受連線了嗎」
      interval: 5s    # 每 5 秒問一次
      timeout: 5s     # 5 秒沒回答就算這次失敗
      retries: 10     # 連續失敗 10 次才判定不健康

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    # 先升級資料庫；成功了（&&）才啟動 API，施工失敗就不啟動
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # 等 db 健康檢查通過才啟動
    environment:
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@db:5432/taskdb
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}